[project]
name = "anki-generator"
version = "0.2.0"
description = "Generate Anki cards from Chinese words using AI providers"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0,<2",
    "python-dotenv>=1.0.0,<2",
    "anyio>=4.0.0,<5",
    "requests>=2.32.0,<3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[project.scripts]
anki-gen = "src.main:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
